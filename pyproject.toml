[project]
name = "fvmrom"
version = "0.1.0"
description = "Reduced-order modelling on top of OpenFOAM (WSL2), with an OpenFOAM MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
rom = [
    "scipy>=1.11",
    "scikit-learn>=1.4",
]
nn = [
    "torch>=2.2",
]

[project.scripts]
fvmrom-mcp = "fvmrom.mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fvmrom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "wsl: requires a working WSL2 + OpenFOAM installation",
]
